<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CXL Studio · คลังผลงาน</title>
<style>
:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#273047;background:#f8f7fd;color-scheme:light}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a78bfa;outline-offset:2px}.hidden{display:none!important}
.shell{max-width:1240px;margin:auto;padding:24px}.top{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:45px;height:45px;border-radius:15px;background:linear-gradient(135deg,#7c3aed,#e849a7);color:white;font-weight:900}.top h1{font-size:22px;margin:0}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.16em;color:#8050cf;margin:0 0 3px}.hero{margin:20px 0 18px;padding:27px;border-radius:23px;background:linear-gradient(110deg,#eee8ff,#fff1f8 70%,white)}.hero h2{font-size:clamp(23px,3vw,31px);margin:0 0 7px}.hero p{margin:0 0 14px}.muted{color:#747d92}.pill{font-size:11px;font-weight:750;color:#6d28d9;background:#f1eaff;padding:5px 9px;border-radius:99px;display:inline-block;width:max-content}
.toolbar{display:grid;grid-template-columns:minmax(220px,2fr) minmax(160px,250px) auto;gap:10px;margin:18px 0}.toolbar input,.toolbar select{width:100%;border:1px solid #ded7ee;background:white;border-radius:13px;padding:12px;min-height:47px;color:#273047}.button{border:0;border-radius:11px;padding:10px 15px;background:#7637e3;color:white;font-weight:750;min-height:44px}.button.secondary{background:#f3edff;color:#6828c9}.button:disabled{opacity:.5}.resultLine{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#6e768a;font-size:13px;margin-bottom:13px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{padding:0;width:100%;text-align:left;display:flex;flex-direction:column;min-height:245px;background:white;border:1px solid #e8e0f4;border-radius:20px;box-shadow:0 8px 25px #7758a515;overflow:hidden}.card:hover{border-color:#b38de7;box-shadow:0 11px 29px #8b6ab32d}.cardCover{height:120px;background:linear-gradient(135deg,#efe9ff,#fff0f7);display:grid;place-items:center;color:#7f6a99;font-size:12px}.cardCover img{height:100%;width:100%;object-fit:cover}.cardBody{padding:15px;display:flex;flex-direction:column;gap:8px;flex:1}.cardBody strong{font-size:17px;line-height:1.4;overflow-wrap:anywhere}.cardBody p{font-size:12px;color:#777e92;margin:auto 0 0}.cardBody .description{font-size:13px;color:#72798d;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.empty{grid-column:1/-1;background:white;border:1px dashed #d9cdef;border-radius:18px;padding:30px;text-align:center}
.dialogBg{position:fixed;inset:0;background:#1a1433a8;z-index:20;display:none;padding:17px;overflow:auto}.dialogBg.open{display:block}.dialog{width:min(980px,100%);min-height:min(590px,calc(100dvh - 34px));margin:auto;background:white;border-radius:22px;display:flex;flex-direction:column;overflow:hidden}.head{padding:20px 23px 14px;border-bottom:1px solid #eee7f6;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.head h2{margin:0;font-size:clamp(20px,3vw,28px);line-height:1.25}.close{border:0;border-radius:11px;padding:9px 12px;background:#f1ebf9;color:#604b80;font-weight:750;min-height:44px}.detailIntro{padding:10px 23px 0}.detailTabs{display:flex;gap:8px;padding:11px 23px;overflow:auto;border-bottom:1px solid #eee7f6}.detailTabs button{border:1px solid #ded3ee;border-radius:999px;background:white;color:#654c86;padding:9px 14px;min-height:44px;white-space:nowrap;font-weight:700}.detailTabs button.active{background:#6f2fd8;border-color:#6f2fd8;color:white}.detailPane{padding:0 23px 25px;overflow:auto}.detailPane[hidden]{display:none}.section{border-bottom:1px solid #eee7f5;padding:19px 0;line-height:1.6}.section h3{font-size:17px;margin:0 0 9px}.code{white-space:pre;overflow:auto;background:#202036;color:#f0ecff;padding:16px;border-radius:13px;max-height:460px;font:13px/1.55 ui-monospace,Consolas,monospace}.prose{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;background:#faf8fe;border:1px solid #eee7f6;color:#273047;padding:16px;border-radius:13px;font:inherit;font-size:15px;line-height:1.75}.section .button{margin-top:9px}.notice{background:#fff4dd;color:#74551a;padding:12px;border-radius:12px;font-size:13px;line-height:1.5}.mediaGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}.mediaBox{border:1px dashed #d1c3e4;border-radius:13px;padding:10px;min-width:0;font-size:12px;overflow-wrap:anywhere}.mediaVisual{height:140px;background:#f2eef8;border-radius:9px;display:grid;place-items:center;text-align:center;color:#756788}.mediaVisual img{width:100%;height:100%;object-fit:cover}.linked{border:1px solid #d9caf3;background:#f4efff;color:#652ac7;border-radius:11px;padding:9px 12px;font-weight:750;min-height:44px}.previewFrame{display:block;width:100%;height:min(67vh,700px);border:1px solid #ded2ef;border-radius:13px;background:white;margin-top:12px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:40;background:#29203c;color:white;border-radius:12px;padding:10px 15px}
@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{grid-template-columns:minmax(0,1fr) minmax(160px,220px)}.toolbar button{grid-column:1/-1}}
html,body{max-width:100%;overflow-x:hidden}.dialogBg,.dialog,.detailPane,.head>div{min-width:0;max-width:100%}.dialogBg{overflow-x:hidden}.head>div{flex:1}.close{flex:none}.detailPane{overflow-x:hidden}
@media(max-width:650px){.shell{padding:13px}.top h1{font-size:19px}.hero{padding:19px;margin:16px 0}.hero h2{font-size:24px}.toolbar{grid-template-columns:1fr;gap:8px}.toolbar button{grid-column:1}.grid{grid-template-columns:1fr;gap:11px}.card{min-height:205px}.cardCover{height:100px}.dialogBg{padding:0}.dialog{width:100%;height:auto;min-height:100dvh;border-radius:0}.head{padding:14px 15px 10px}.head h2{font-size:20px}.detailIntro{padding:8px 15px 0}.detailTabs{padding:9px 15px}.detailPane{padding:0 15px 65px}.code{font-size:12px;max-height:55vh}.prose{padding:13px;font-size:15px}.previewFrame{height:65vh}.mediaGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.mediaVisual{height:115px}}
@media(max-width:650px){.head{padding-right:78px}.head .close{position:fixed;right:12px;top:12px;z-index:4}}
</style>
</head>
<body>
<div class="shell"><header class="top"><div class="logo">CXL</div><div><p class="eyebrow">CXL STUDIO · TEMPORARY</p><h1>คลังผลงาน</h1></div></header><section class="hero"><p class="eyebrow">DISCOVER CREATIVE WORKS</p><h2>สำรวจผลงานและคอลแลป</h2><p class="muted">เปิดอ่าน ค้นหา และคัดลอกข้อความหรือโค้ดที่เผยแพร่ได้</p><span id="count" class="pill">กำลังโหลด...</span></section><div class="toolbar"><input id="search" type="search" aria-label="ค้นหาผลงาน" placeholder="ค้นหาชื่อ แท็ก หรือคำอธิบาย"><select id="category" aria-label="กรองหมวดหมู่"><option value="">ทุกหมวด</option><option value="character">โปรไฟล์ตัวละคร</option><option value="lore">เนื้อเรื่อง / โลกทัศน์</option><option value="ui_code">โค้ดหน้าตา UI</option><option value="prompts">คำสั่งพรอมต์</option><option value="collab">คอลแลป</option><option value="app_data">แอป / แพลตฟอร์ม</option></select><button id="deepSearch" class="button secondary" onclick="deepSearch()">ค้นหาในเนื้อหา/โค้ด</button></div><div class="resultLine"><span id="resultLabel">กำลังโหลด...</span><button id="clearButton" class="button secondary hidden" onclick="clearFilters()">ล้างตัวกรอง</button></div><div id="grid" class="grid"></div><p id="error" class="notice hidden"></p></div>
<div id="modal" class="dialogBg"><div class="dialog"><div class="head"><div><p class="eyebrow">WORK DETAIL</p><h2 id="title"></h2></div><button class="close" onclick="closeDetail()">ปิด ✕</button></div><div id="detailIntro" class="detailIntro"></div><nav id="detailTabs" class="detailTabs" aria-label="ส่วนของผลงาน"></nav><div id="detail"></div></div></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
const $=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const categories={character:'โปรไฟล์ตัวละคร',lore:'เนื้อเรื่อง / โลกทัศน์',ui_code:'โค้ดหน้าตา UI',prompts:'คำสั่งพรอมต์',collab:'คอลแลป',app_data:'แอป / แพลตฟอร์ม'};
const statuses={idea:'ไอเดีย',draft:'ฉบับร่าง',in_progress:'กำลังทำ',finished:'เสร็จแล้ว',archived:'เก็บถาวร'};
let works=[],current=null,deepIds=null,copyValues=[],requestToken=0,toastTimer=null,observer=null;
function call(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args))}
// The page runs inside Apps Script's sandbox iframe: the visible URL is read and changed only through google.script.url/history.
function pageParam(name){return new Promise(resolve=>{try{google.script.url.getLocation(loc=>resolve((loc&&loc.parameter&&loc.parameter[name])||''))}catch{resolve('')}})}
function setPageParams(params){try{google.script.history.replace(null,params,'')}catch{}}
function toast(message){$('toast').textContent=message;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3200)}
function date(value){return String(value||'').slice(0,10)}
async function load(){try{works=await call('listPublicWorks');$('count').textContent=works.length+' ผลงาน';render();const id=await pageParam('id');if(id)openDetail(id)}catch(error){$('error').textContent=error.message||String(error);$('error').classList.remove('hidden')}}
function render(){const query=$('search').value.trim().toLocaleLowerCase(),category=$('category').value;const found=works.filter(x=>(!category||x.category===category)&&(!deepIds?(!query||[x.title,x.description,...(x.tags||[])].join(' ').toLocaleLowerCase().includes(query)):deepIds.includes(x.id))).sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));$('resultLabel').textContent='พบ '+found.length+' จาก '+works.length+' ผลงาน';$('clearButton').classList.toggle('hidden',!query&&!category&&!deepIds);$('grid').innerHTML=found.map(x=>'<button class="card" data-work-id="'+esc(x.id)+'"><div class="cardCover">'+(x.coverRef?'<img data-media-ref="'+esc(x.coverRef)+'" data-asset-id="'+esc(x.id)+'" alt="ภาพปก '+esc(x.title)+'">':'ยังไม่มีภาพปก')+'</div><div class="cardBody"><span class="pill">'+esc(categories[x.category]||x.category)+'</span><strong>'+esc(x.title)+'</strong><span class="description">'+esc(x.description||'')+'</span>'+(x.category==='ui_code'?'<span class="pill">มีพรีวิวโค้ด</span>':'')+'<p>'+esc(date(x.updatedAt))+' · '+esc(statuses[x.status]||x.status)+'</p></div></button>').join('')||'<div class="empty">ไม่พบงานที่ตรงกับตัวกรอง</div>';loadImages($('grid'),true)}
async function deepSearch(){const q=$('search').value.trim();if(q.length<2){toast('ใส่คำค้นอย่างน้อย 2 ตัวอักษร');return}$('deepSearch').disabled=true;try{deepIds=await call('searchPublicContent',q);render()}catch(error){$('error').textContent=error.message||String(error);$('error').classList.remove('hidden')}finally{$('deepSearch').disabled=false}}
function clearFilters(){$('search').value='';$('category').value='';deepIds=null;render()}
function loadImages(root,thumbnail){if(observer)observer.disconnect();const images=[...root.querySelectorAll('img[data-media-ref]')];observer=new IntersectionObserver(entries=>{entries.forEach(async entry=>{if(!entry.isIntersecting)return;const img=entry.target;observer.unobserve(img);try{img.src=await call('getPublicMediaRef',img.dataset.assetId,img.dataset.mediaRef,thumbnail)}catch{img.replaceWith(document.createTextNode('ยังไม่มีไฟล์ภาพ'))}})},{rootMargin:'160px'});images.forEach(image=>observer.observe(image))}
async function openDetail(id){const token=++requestToken;$('title').textContent='กำลังโหลด...';$('detailIntro').innerHTML='';$('detailTabs').innerHTML='';$('detail').innerHTML='<p class="muted">กำลังเปิดผลงาน...</p>';$('modal').classList.add('open');document.body.style.overflow='hidden';try{const r=await call('getPublicWork',id);if(token!==requestToken)return;current=r;setPageParams({id});renderDetail()}catch(error){if(token===requestToken)$('detail').innerHTML='<p class="notice">'+esc(error.message||error)+'</p>'}}
function closeDetail(){requestToken++;$('modal').classList.remove('open');document.body.style.overflow='';setPageParams({})}
function copySection(label,value,isCode){const key=copyValues.push(value||'')-1;return '<section class="section"><h3>'+esc(label)+'</h3><pre class="'+(isCode?'code':'prose')+'">'+esc(value||'')+'</pre><button class="button secondary" data-copy="'+key+'">คัดลอกส่วนนี้</button></section>'}
function media(ref,record){if(!ref)return '';const available=ref.startsWith('cxl-media:')||!!(record.mediaAvailable&&record.mediaAvailable[ref]);return '<div class="mediaBox"><div class="mediaVisual">'+(available?'<img data-media-ref="'+esc(ref)+'" data-asset-id="'+esc(record.id)+'" alt="ภาพประกอบ">':'🖼️ ยังไม่มีไฟล์ภาพ')+'</div></div>'}
function renderDetail(){const r=current;copyValues=[];$('title').textContent=r.title||'';$('detailIntro').innerHTML='<p><span class="pill">'+esc(categories[r.category]||r.category)+'</span> <span class="pill">'+esc(statuses[r.status]||r.status)+'</span></p>'+(r.short_description?'<p class="muted">'+esc(r.short_description)+'</p>':'');let read='';if(r.linkedCollaboration)read+='<section class="section"><button class="linked" data-linked-id="'+esc(r.linkedCollaboration.id)+'">ดูคอลแลปที่เชื่อม: '+esc(r.linkedCollaboration.title)+' →</button></section>';if(r.content)read+=copySection('เนื้อหาหลัก',r.content,false);(r.content_blocks||[]).forEach(block=>{if(block.body)read+=copySection(block.title||block.type||'เนื้อหา',block.body,block.type==='Code')});if(r.public_collaboration){const c=r.public_collaboration;read+='<section class="section"><h3>คอลแลป · '+esc(c.name||'')+'</h3><p>'+esc(c.sharedTag?'#'+c.sharedTag:'')+' · '+esc((c.platforms||[]).join(' · '))+'</p></section>';for(const part of c.sharedInformation||[])read+=copySection(part.title||'ข้อมูลร่วม',part.content,part.type==='code');if((c.deadlines||[]).length)read+='<section class="section"><h3>กำหนดส่ง</h3>'+c.deadlines.map(x=>'<p>'+esc(x.label||'')+' · '+esc(x.date||'')+'</p>').join('')+'</section>';if((c.participants||[]).length)read+='<section class="section"><h3>ผู้เข้าร่วม</h3>'+c.participants.map(person=>'<div class="section"><strong>'+esc(person.creatorName||'')+'</strong> · '+esc(person.externalWorkName||'')+(person.notes?'<p>'+esc(person.notes)+'</p>':'')+(person.dataStatus?'<p class="muted">สถานะข้อมูล: '+esc(person.dataStatus)+'</p>':'')+((person.referenceImages||[]).length?'<div class="mediaGrid">'+person.referenceImages.map(x=>media(typeof x==='string'?x:(x.src||x.storageKey||''),r)).join('')+'</div>':'')+'</div>').join('')+'</section>'}const refs=[r.preview_image,...(r.preview_images||[])].filter((x,i,a)=>x&&a.indexOf(x)===i);if(refs.length)read+='<section class="section"><h3>รูปภาพ</h3><div class="mediaGrid">'+refs.map(x=>media(x,r)).join('')+'</div></section>';const hasCode=!!r.ui_code_snippet,tabs=[['read','อ่านงาน']].concat(hasCode?[['code','โค้ด HTML/CSS'],['preview','ดูตัวอย่าง']]:[]);$('detailTabs').innerHTML=tabs.map(pair=>'<button type="button" data-tab="'+pair[0]+'">'+pair[1]+'</button>').join('');$('detail').innerHTML='<div id="pane-read" class="detailPane">'+(read||'<p class="muted">ยังไม่มีเนื้อหาที่เผยแพร่</p>')+'</div>'+(hasCode?'<div id="pane-code" class="detailPane" hidden>'+copySection('HTML / CSS',r.ui_code_snippet,true)+'</div><div id="pane-preview" class="detailPane" hidden><section class="section"><h3>ตัวอย่างหน้า HTML/CSS</h3><p class="notice">กดเปิดเมื่อพร้อมดู พรีวิวอยู่ในกรอบแยกและไม่รัน JavaScript</p><button class="button" onclick="startPreview()">เปิดตัวอย่าง</button><div id="previewHost"></div></section></div>':'');showTab('read');loadImages($('detail'),true)}
function showTab(tab){$('detailTabs').querySelectorAll('button').forEach(button=>button.classList.toggle('active',button.dataset.tab===tab));$('detail').querySelectorAll('.detailPane').forEach(pane=>pane.hidden=pane.id!=='pane-'+tab);$('modal').scrollTop=0}
function startPreview(){if(!current?.ui_code_snippet)return;const host=$('previewHost');host.innerHTML='<iframe class="previewFrame" title="ตัวอย่าง HTML/CSS" sandbox="" referrerpolicy="no-referrer"></iframe>';const policy='<meta http-equiv="Content-Security-Policy" content="default-src &#39;none&#39;; img-src https: data:; style-src &#39;unsafe-inline&#39; https:; font-src https: data:; script-src &#39;none&#39;; connect-src &#39;none&#39;; form-action &#39;none&#39;; base-uri &#39;none&#39;">';host.querySelector('iframe').srcdoc=policy+current.ui_code_snippet}
async function copyByIndex(index){try{await navigator.clipboard.writeText(copyValues[index]||'');toast('คัดลอกแล้ว')}catch{toast('คัดลอกไม่สำเร็จ กรุณาเลือกข้อความเอง')}}
$('search').addEventListener('input',()=>{deepIds=null;render()});$('category').addEventListener('change',render);$('grid').addEventListener('click',event=>{const card=event.target.closest('[data-work-id]');if(card)openDetail(card.dataset.workId)});$('detailTabs').addEventListener('click',event=>{const button=event.target.closest('[data-tab]');if(button)showTab(button.dataset.tab)});$('detail').addEventListener('click',event=>{const copy=event.target.closest('[data-copy]'),linked=event.target.closest('[data-linked-id]');if(copy)copyByIndex(Number(copy.dataset.copy));if(linked)openDetail(linked.dataset.linkedId)});$('modal').addEventListener('click',event=>{if(event.target===$('modal'))closeDetail()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&$('modal').classList.contains('open'))closeDetail()});load();
</script>
</body>
</html>
