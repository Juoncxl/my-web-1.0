<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">CXL Studio light lockup</title>
  <desc id="desc">The CXL Studio light-mode lockup with the same luminous crescent monogram and a deeper pastel treatment for light backgrounds.</desc>
  <defs>
    <linearGradient id="lockupLightIri" x1="42" y1="43" x2="278" y2="272" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7d57d7"/>
      <stop offset=".34" stop-color="#b996e6"/>
      <stop offset=".68" stop-color="#78b9d8"/>
      <stop offset="1" stop-color="#d894b6"/>
    </linearGradient>
    <linearGradient id="lockupLightBlade" x1="203" y1="215" x2="250" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8d74d7"/>
      <stop offset=".58" stop-color="#82c2dc"/>
      <stop offset="1" stop-color="#d58eae"/>
    </linearGradient>
    <linearGradient id="lockupLightWord" x1="0" y1="0" x2="290" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5a3e8f"/>
      <stop offset=".48" stop-color="#5f54a3"/>
      <stop offset="1" stop-color="#2f668c"/>
    </linearGradient>
    <filter id="lockupLightGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="lockupLightCatCutout" maskUnits="userSpaceOnUse" x="0" y="0" width="320" height="320">
      <rect width="320" height="320" fill="white"/>
      <path d="M145 153 L153 140 L163 149 L173 140 L181 153 L180 164 L146 164Z" fill="black"/>
    </mask>
  </defs>

  <g transform="translate(18 2) scale(.66)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#lockupLightGlow)" mask="url(#lockupLightCatCutout)">
      <path d="M249 73 C220 45 178 37 135 46 C84 57 51 99 51 152 C51 207 89 248 143 256 C186 263 225 246 249 218" stroke="url(#lockupLightIri)" stroke-width="24"/>
      <path d="M122 108 L202 198" stroke="url(#lockupLightIri)" stroke-width="22"/>
      <path d="M202 108 L122 198" stroke="url(#lockupLightIri)" stroke-width="22"/>
      <path d="M203 91 L203 215" stroke="url(#lockupLightIri)" stroke-width="22"/>
      <path d="M203 215 C219 215 236 215 250 214" stroke="url(#lockupLightBlade)" stroke-width="13"/>
    </g>
    <path d="M191 205 L215 205" fill="none" stroke="#e3d4ef" stroke-width="4" stroke-linecap="round" opacity=".95"/>
    <path d="M71 251 C122 288 221 286 274 242" fill="none" stroke="#789bd0" stroke-width="3" opacity=".9"/>
    <path d="M273 241 l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z" fill="#bd8fb5"/>
    <circle cx="72" cy="79" r="4" fill="#6ba8cf"/>
  </g>

  <g transform="translate(250 74)">
    <text x="0" y="52" fill="url(#lockupLightWord)" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="54" font-weight="650" letter-spacing="-.045em">CXL Studio</text>
    <text x="4" y="88" fill="#77688f" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing=".23em">CREATOR VAULT</text>
  </g>
</svg>
