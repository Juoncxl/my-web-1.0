<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">CXL Studio Concept A mark</title>
  <desc id="desc">A compact CXL monogram with a hidden cat, a katana-like baseline, and one orbit star.</desc>
  <defs>
    <linearGradient id="aIri" x1="34" y1="45" x2="276" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b779ff"/>
      <stop offset="0.42" stop-color="#dfc5ff"/>
      <stop offset="0.72" stop-color="#a7dbff"/>
      <stop offset="1" stop-color="#f5bfd8"/>
    </linearGradient>
    <linearGradient id="aBlade" x1="102" y1="212" x2="258" y2="212" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d0b6ff"/>
      <stop offset="0.6" stop-color="#b7e5ff"/>
      <stop offset="1" stop-color="#f5c8dd"/>
    </linearGradient>
    <filter id="aGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="aCatCutout" maskUnits="userSpaceOnUse" x="0" y="0" width="320" height="320">
      <rect width="320" height="320" fill="white"/>
      <path d="M148 144 L156 132 L166 141 L176 132 L184 145 L184 164 C184 178 174 187 166 187 C154 187 146 177 146 164Z" fill="black"/>
      <circle cx="157" cy="158" r="2.5" fill="white"/>
      <circle cx="174" cy="158" r="2.5" fill="white"/>
    </mask>
  </defs>

  <g fill="none" stroke="url(#aIri)" stroke-linecap="round" stroke-linejoin="round" filter="url(#aGlow)" mask="url(#aCatCutout)">
    <!-- C: the open tidal crescent -->
    <path d="M238 77 C218 54 183 43 146 47 C91 53 52 93 52 151 C52 210 92 251 148 255 C184 258 217 245 239 222" stroke-width="24"/>
    <!-- X: two clean crossing monogram strokes -->
    <path d="M122 108 L202 198" stroke-width="22"/>
    <path d="M202 108 L122 198" stroke-width="22"/>
    <!-- L: vertical stem and katana-like foot -->
    <path d="M203 91 L203 215" stroke-width="22"/>
    <path d="M203 215 L258 215" stroke="url(#aBlade)" stroke-width="13"/>
    <path d="M258 215 L278 211 L258 219" fill="url(#aBlade)" stroke="none"/>
    <path d="M191 205 L215 205" stroke="#e9d9ff" stroke-width="5"/>
  </g>

  <!-- Single orbit and anchor star keep the mark distinctive without clutter. -->
  <path d="M72 238 C112 286 204 286 263 246" fill="none" stroke="#c7b2f4" stroke-width="3" opacity="0.72"/>
  <path d="M265 245 l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z" fill="#f1d8f0"/>
  <circle cx="70" cy="79" r="4" fill="#bce2ff"/>
</svg>
